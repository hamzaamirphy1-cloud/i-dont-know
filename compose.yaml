services:
  db:
    image: postgres:17-alpine
    container_name: vibe96-postgres
    environment:
      POSTGRES_USER: vibe96
      POSTGRES_PASSWORD: vibe96_local_only
      POSTGRES_DB: vibe96
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe96 -d vibe96"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
    name: vibe96-postgres-data
